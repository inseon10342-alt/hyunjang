<!doctype html>
<html lang="ko">
<head>

<style>
:root{--navy:#172B4D;--blue:#2563EB;--bg:#F5F7FA;--line:#E3E8EF;--soft:#EEF2F6;--ink:#172B4D;--muted:#5B6B82;--ok:#166534;--okb:#E7F6EC;--warn:#8A4405;--warnb:#FEF3E2;--bad:#B91C1C;--badb:#FDECEC;--info:#1D4ED8;--infob:#E8F0FE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.5}
button,input{font:inherit;color:inherit}
.hdr{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
.hdr h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ib{width:44px;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.stamp{font-size:12.5px;color:var(--muted);padding:10px 16px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stamp.err{color:var(--bad)}
main{padding:12px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{font-size:16px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px;text-align:left;min-height:96px}
.k span{font-size:13px;color:var(--muted);font-weight:600}.k b{font-size:28px;letter-spacing:-.02em;line-height:1.15}.k small{font-size:12.5px;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft)}.bar i{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:8px}.lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--okb);color:var(--ok)}.p-warn{background:var(--warnb);color:var(--warn)}.p-bad{background:var(--badb);color:var(--bad)}.p-info{background:var(--infob);color:var(--info)}.p-mute{background:var(--soft);color:#475569}.p-navy{background:var(--navy);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #F0F3F7;min-height:56px}
.row:first-child{border-top:0}
.row .t{font-weight:700;font-size:15px}.row .s{font-size:13px;color:var(--muted)}
.tap{width:100%;text-align:left;border:0;background:none;padding:0;cursor:pointer}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.search{display:flex;align-items:center;gap:8px;height:48px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 14px;color:var(--muted)}
.search input{border:0;outline:none;background:transparent;width:100%;font-size:16px;color:var(--ink)}
.site{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini .bar{height:6px;margin-top:4px}
.tag{display:inline-block;padding:2px 9px;border-radius:7px;background:#F1F4F9;color:#334155;font-size:12.5px;margin:0 4px 4px 0}
.box{background:var(--bg);border-radius:12px;padding:12px}
.box span{font-size:12.5px;color:var(--muted)}.box b{display:block;font-size:17px}
.tl{display:flex;gap:12px;padding:10px 0;border-top:1px solid #F0F3F7}.tl:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:5px}
.memo{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
.dhead{font-weight:800;font-size:14px;padding:14px 2px 4px;color:var(--navy)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:96px}
.mi b{font-size:15.5px}.mi small{color:var(--muted);font-size:12.5px}
.mi svg{color:var(--blue)}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.bn button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);min-height:54px;justify-content:center;border-radius:12px}
nav.bn button.on{color:var(--blue)}
.btn{height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:15px;padding:0 18px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{height:40px;font-size:14px;padding:0 14px}
.btn.danger{color:var(--bad)}
.inp{width:100%;height:52px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:17px;background:#fff}
.center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:14px;max-width:440px;margin:0 auto}
.logo{width:56px;height:56px;border-radius:16px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.note{font-size:13.5px;color:var(--muted)}
.err{color:var(--bad)}
.alerts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.al{flex:none;height:40px;border-radius:99px;padding:0 14px;border:1px solid;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.al.bad{background:var(--badb);border-color:#F7C9C9;color:#991B1B}.al.warn{background:var(--warnb);border-color:#F8DDB5;color:var(--warn)}.al.ok{background:var(--okb);border-color:#C5E8D1;color:var(--ok)}
.skel{height:96px;border-radius:16px;background:linear-gradient(90deg,#EEF2F6,#F7F9FB,#EEF2F6);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:14px}
.kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;font-size:14px}.kv>span:nth-child(odd){color:var(--muted)}
.amt{font-variant-numeric:tabular-nums;font-weight:800}
.calbar{display:flex;align-items:center;gap:6px;margin:0 0 8px}.calbar b{font-size:17px;min-width:92px;text-align:center}
.ib2{height:36px;min-width:36px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:18px;font-weight:700;color:var(--navy)}.ib2.sm{font-size:13px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}.seg button{border:0;background:none;height:30px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}.seg .on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cal{padding:8px 6px}.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}.sun{color:#C2410C}.sat{color:var(--info)}
.cd{min-height:70px;border:0;background:none;border-radius:8px;padding:3px 2px;display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;min-width:0}
.cd .n{font-size:12.5px;font-weight:700;text-align:center;line-height:20px;width:22px;height:22px;border-radius:50%;align-self:center}
.cd.out{opacity:.38}.cd.today .n{background:var(--blue);color:#fff}.cd.sel{background:var(--infob)}
.ev{display:block;font-size:10px;line-height:15px;padding:0 3px;border-radius:3px;background:var(--b);color:var(--c);border-left:2px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.done{background:#F2F4F7;color:#A3ACB9;border-left:2px solid transparent;font-weight:500}
.cd .more{font-size:10px;color:var(--muted);text-align:center}
.row.done .t,.row.done .s{color:#98A2B3}
</style>

<body>
<div id="app"></div>
<script>
'use strict';
// ---------- 아이콘
const PATHS = { home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>', sites: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/>', cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  grid: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  back: '<path d="M15 6l-6 6 6 6"/>', refresh: '<path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', doc: '<path d="M6 3h9l4 4v14H6z"/>',
  won: '<path d="M4 7l3 10 5-10 5 10 3-10M3 11h18"/>', box: '<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>', check: '<path d="M5 12l4 4 10-10"/>', phone: '<path d="M5 4h4l2 5-3 2a11 11 0 006 6l2-3 5 2v4a2 2 0 01-2 2A17 17 0 013 6a2 2 0 012-2z"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>', book: '<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/>', truck: '<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>' };
const ic = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[n]}</svg>`;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = (n) => (n ? Math.round(n).toLocaleString('ko-KR') : '0');
const ymd = (s) => (s ? s.replace(/^(\d{4})-0?(\d+)-0?(\d+)$/, '$1. $2. $3.') : '');
const md = (s) => (s ? s.replace(/^\d{4}-0?(\d+)-0?(\d+)$/, '$1/$2') : '');
const dlab = (n) => (n == null ? '' : n === 0 ? 'D-day' : n > 0 ? 'D-' + n : 'D+' + -n);
const dcls = (n) => (n == null ? 'p-mute' : n < 0 ? 'p-bad' : n <= 14 ? 'p-warn' : 'p-mute');
const $ = (s) => document.querySelector(s);

// ---------- 안전한 보관: 브라우저가 꺼낼 수 없는 키(IndexedDB)로 토큰·캐시를 암호화해 저장
const Vault = (() => {
  let keyP = null;
  const db = () => new Promise((res, rej) => { const r = indexedDB.open('ssv', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  async function key() {
    if (keyP) return keyP;
    const to = (ms) => new Promise((_, rej) => setTimeout(() => rej(new Error('vault timeout')), ms));
    keyP = Promise.race([to(4000), (async () => {
      const d = await db();
      const got = await new Promise((res) => { const t = d.transaction('k').objectStore('k').get('aes'); t.onsuccess = () => res(t.result); t.onerror = () => res(null); });
      if (got) return got;
      const k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      await new Promise((res) => { const t = d.transaction('k', 'readwrite').objectStore('k').put(k, 'aes'); t.onsuccess = res; t.onerror = res; });
      return k;
    })()]);
    keyP.catch(() => { keyP = null; });
    return keyP;
  }
  const b64 = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
  const ub = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  return {
    async set(name, val) { try { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await key(), new TextEncoder().encode(JSON.stringify(val))); localStorage.setItem('v:' + name, b64(iv) + '.' + b64(ct)); return true; } catch (e) { return false; } },
    async get(name) { try { const s = localStorage.getItem('v:' + name); if (!s) return null; const [iv, ct] = s.split('.'); const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(iv) }, await key(), ub(ct)); return JSON.parse(new TextDecoder().decode(pt)); } catch (e) { return null; } },
    del(name) { try { localStorage.removeItem('v:' + name); } catch (e) {} },
    clear() { try { Object.keys(localStorage).filter((k) => k.startsWith('v:')).forEach((k) => localStorage.removeItem(k)); } catch (e) {} },
  };
})();

// ---------- 서버 호출 (조회 전용)
const App = { token: null, user: null, stack: [], meta: null, offline: false, lastOk: null };
function run(fn, ...args) {
  // Apps Script 안에서 열면 google.script.run, 별도 주소(GitHub Pages)에서 열면 config.js 의 웹앱 주소로 요청
  if (window.google && google.script && google.script.run) {
    return new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error('timeout')), 120000);
      google.script.run.withSuccessHandler((r) => { clearTimeout(t); res(r); }).withFailureHandler((e) => { clearTimeout(t); rej(e); })[fn](...args);
    });
  }
  if (!window.API_URL || !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(window.API_URL)) return Promise.reject(new Error('config.js 에 웹앱 주소(API_URL)를 넣어 주세요.'));
  // <script> 로 요청 (아이폰 Safari 는 다른 주소로의 fetch 응답을 막는 경우가 있음). 요청마다 1회용 콜백 이름을 쓴다.
  return new Promise((res, rej) => {
    const cb = '__r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const sc = document.createElement('script');
    const done = (fnr, v) => { clearTimeout(t); try { delete window[cb]; } catch (e) { window[cb] = undefined; } sc.remove(); fnr(v); };
    const t = setTimeout(() => done(rej, new Error('timeout')), 90000);
    window[cb] = (r) => done(res, r);
    sc.onerror = () => done(rej, new Error('Load failed'));
    sc.src = window.API_URL + '?cb=' + cb + '&q=' + encodeURIComponent(JSON.stringify({ fn, args })) + '&_=' + Date.now();
    document.head.appendChild(sc);
  });
}
// 화면은 휴대폰에 암호화해 둔 직전 결과로 바로 그리고, 서버 확인은 뒤에서 한다 (바뀌었으면 다시 그림)
App.inflight = {}; App.failAt = {};
async function netCall(action, arg, key) {
  const send = Object.assign({}, arg || {}); if (App.forceNet) send._r = 1;
  const r = await run('api', App.token, action, send);
  if (!r || !r.ok) {
    if (r && r.code === 'auth') { await signOut(r.msg); throw new Error('auth'); }
    throw new Error((r && r.msg) || '데이터를 받지 못했습니다.');
  }
  App.offline = false; App.meta = r.meta || App.meta; App.lastOk = new Date();
  if (key) await Vault.set('c:' + key, { at: Date.now(), r });
  return r;
}
function revalidate(action, arg, key, c) {
  if (App.inflight[key] || Date.now() - (App.failAt[key] || 0) < 60000) return;
  App.inflight[key] = 1;
  const top = JSON.stringify(App.stack[App.stack.length - 1]);
  const same = () => JSON.stringify(App.stack[App.stack.length - 1]) === top;
  netCall(action, arg, key)
    .then((r) => { if (same() && JSON.stringify(r) !== JSON.stringify(c.r)) show(); else if (same()) stampOk(); })
    .catch((e) => { if (e.message === 'auth') return; App.failAt[key] = Date.now(); App.offline = true; App.cacheAt = c.at; if (same()) show(); })
    .finally(() => { delete App.inflight[key]; });
}
function stampOk() { const el = document.querySelector('.stamp'); if (el && App.meta && !App.offline) el.classList.remove('err'); }
async function call(action, arg, opt) {
  opt = opt || {};
  const key = action + ':' + JSON.stringify(arg || {});
  if (!opt.nocache && !App.forceNet) {
    const c = await Vault.get('c:' + key);
    if (c) {
      App.meta = c.r.meta || App.meta;
      if (!App.offline || Date.now() - (App.failAt[key] || 0) >= 60000) { if (Date.now() - c.at > 15000) revalidate(action, arg, key, c); }
      if (App.offline) App.cacheAt = c.at;
      return c.r;
    }
  }
  try {
    return await netCall(action, arg, opt.nocache ? null : key);
  } catch (e) {
    if (e.message === 'auth') throw e;
    const c = opt.nocache ? null : await Vault.get('c:' + key);
    App.offline = true;
    if (c) { App.meta = c.r.meta; App.cacheAt = c.at; return c.r; }
    throw e;
  }
}
function calRange(y, m) {
  if (y == null) { const t = new Date(); y = t.getFullYear(); m = t.getMonth(); }
  const f = new Date(y, m, 1), a = new Date(y, m, 1 - f.getDay()), b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 41);
  return { from: isoD(a), to: isoD(b) };
}
// 홈을 연 뒤 아래 탭(현장 목록·일정)만 미리 받아 둔다 — 상세 정보는 누를 때 받는다
let prefetched = false;
function prefetch() {
  if (prefetched) return; prefetched = true;
  setTimeout(() => { [['sites', {}], ['schedule', calRange()]].forEach(([a, g]) => { const k = a + ':' + JSON.stringify(g); Vault.get('c:' + k).then((c) => { if (!c || Date.now() - c.at > 15000) netCall(a, g, k).catch(() => {}); }); }); }, 800);
  // 업무 메뉴 8개는 하루 한 번만, 오늘 받아 둔 게 없는 화면만 하나씩 차례로 받는다
  setTimeout(async () => {
    const today = isoD(new Date());
    for (const a of ['writing', 'pay', 'requests', 'reviews', 'contacts', 'mails', 'journal', 'outsource']) {
      const k = a + ':{}', c = await Vault.get('c:' + k);
      if (c && isoD(new Date(c.at)) === today) continue;
      try { await netCall(a, {}, k); } catch (e) { break; }
    }
  }, 3000);
}

// ---------- 화면 틀
const TABS = [['home', 'home', '홈'], ['sites', 'sites', '현장'], ['cal', 'cal', '일정'], ['more', 'grid', '업무'], ['me', 'user', '내 정보']];
function shell(title, body, opt) {
  opt = opt || {};

function short(n) { return String(n).replace(/\s*(신축공사|신축|공사|해체공사|복합시설|근린생활시설|재건축정비사업)\s*/g, ' ').trim().split(/[\s,]+/)[0]; }
const MORE = [['writing', 'doc', '보고서 작성', '기한별 진행 상태'], ['pay', 'won', '계약·입금', '수금률 · 입금 대기'], ['requests', 'box', '자료 요청', '미수신 · 회신 현황'], ['reviews', 'check', '보고서 검토', '검토 상태 · 의견'],
  ['contacts', 'phone', '현장 연락', '연락 기록 · 다음 연락'], ['mails', 'mail', '메일', '발송 · 회신 이력'], ['journal', 'book', '업무일지', '날짜별 기록'], ['outsource', 'truck', '외주·택배', '지급 · 발송 현황']];
VIEWS.more = async () => shell('업무', `<div class="menu">${MORE.map(([k, i, l, s]) => `<button class="mi tap" data-go="${k}">${ic(i, 24)}<b>${l}</b><small>${s}</small></button>`).join('')}</div>`, { bind: bindCommon });
const listView = (action, title, render) => async () => { const r = await call(action); shell(title, render(r), { bind: bindCommon }); };
VIEWS.writing = listView('writing', '보고서 작성', (r) => { const W = r.writing; const g = [['기한 초과', (w) => w.d < 0], ['7일 이내', (w) => w.d >= 0 && w.d <= 7], ['8–14일', (w) => w.d >= 8 && w.d <= 14], ['15일 이상', (w) => w.d == null || w.d >= 15]];
  return g.map(([l, f]) => { const xs = W.filter(f); return `<section class="card"><h2>${l} · ${xs.length}</h2>${xs.map((w) => `<button class="row tap" data-site="${esc(w.용역)}"><span class="pill ${dcls(w.d)}">${dlab(w.d)}</span><div class="grow"><div class="t ell">${esc(w.용역)}</div><div class="s">${esc(w.항목)} · 점검 ${ymd(w.점검일)} · 기한 ${ymd(w.기한)}</div>${w.report ? `<div class="s">보고서도구 · ${esc(w.report.stage)}</div>` : ''}</div></button>`).join('') || '<div class="empty">없음</div>'}</section>`; }).join(''); });
VIEWS.pay = listView('pay', '계약·입금', (r) => { const sum = (k) => r.pay.reduce((a, p) => a + (p[k] || 0), 0);
  return `<div class="grid2"><div class="k"><span>계약금</span><b class="amt" style="font-size:20px">${won(sum('계약금'))}</b></div><div class="k"><span>받은 돈</span><b class="amt" style="font-size:20px">${won(sum('수금'))}</b><small>${Math.round(sum('수금') / Math.max(1, sum('계약금')) * 100)}%</small></div><div class="k"><span>입금 대기</span><b class="amt" style="font-size:20px;color:var(--info)">${won(sum('대기'))}</b><small>계산서 ${r.invoices.length}건</small></div><div class="k"><span>미수금</span><b class="amt" style="font-size:20px">${r.unpaid ? won(r.unpaid) : '없음'}</b></div></div>
    <section class="card"><h2>입금 대기 계산서</h2>${r.invoices.sort((a, b) => b.경과 - a.경과).map((x) => `<button class="row tap" data-site="${esc(x.용역)}"><span class="pill ${x.경과 > 60 ? 'p-bad' : x.경과 > 30 ? 'p-warn' : 'p-mute'}">${x.경과}일</span><div class="grow"><div class="t ell">${esc(x.용역)}</div><div class="s">${esc(x.품명)} · ${ymd(x.발행일)}</div></div><span class="amt">${won(x.미입금)}</span></button>`).join('') || '<div class="empty">없음</div>'}</section>
    <section class="card"><h2>용역별 수금</h2>${r.pay.sort((a, b) => b.대기 - a.대기).map((p) => `<button class="row tap" data-site="${esc(p.용역)}" style="flex-direction:column;align-items:stretch;gap:6px"><div style="display:flex;gap:8px"><span class="t ell grow">${esc(p.용역)}</span><b>${Math.round(p.기성율 * 100)}%</b></div><div class="bar"><i style="width:${Math.min(p.수금, p.계약금) / Math.max(1, p.계약금) * 100}%;background:#172B4D"></i><i style="width:${Math.min(p.대기, p.계약금) / Math.max(1, p.계약금) * 100}%;background:#60A5FA"></i></div><div class="s">수금 ${won(p.수금)} · 대기 ${won(p.대기)} / 계약 ${won(p.계약금)}</div></button>`).join('')}</section>
    <section class="card"><h2>최근 입금</h2>${r.paidRecent.map((x) => `<div class="row"><div class="grow"><div class="t ell">${esc(x.용역)}</div><div class="s">${ymd(x.입금일)} · ${esc(x.품명)}</div></div><span class="amt">${won(x.수금 || x.청구)}</span></div>`).join('')}</section>`; });
VIEWS.requests = listView('requests', '자료 요청', (r) => { const open = r.requests.filter((x) => x.상태 !== '수신완료'), done = r.requests.filter((x) => x.상태 === '수신완료');
  const c = (x) => `<button class="row tap" data-site="${esc(x.용역)}" style="flex-direction:column;align-items:stretch;gap:4px"><div style="display:flex;gap:8px;align-items:center"><span class="pill ${x.상태 === '수신완료' ? 'p-ok' : 'p-warn'}">${esc(x.상태 || '-')}</span><span class="s">${ymd(x.요청일)} · ${esc(x.방법)}</span></div><div class="t">${esc(x.자료)}</div><div class="s">${esc(x.용역)}${x.담당자 ? ' · ' + esc(x.담당자) : ''}${x.수신일 ? ' · ' + ymd(x.수신일) + ' 수신 (' + esc(x.소요) + '일)' : ''}</div></button>`;
  return `<section class="card"><h2>미수신 · ${open.length}</h2>${open.map(c).join('') || '<div class="empty">미수신 요청이 없습니다</div>'}</section><section class="card"><h2>수신완료 · ${done.length}</h2>${done.slice(0, 30).map(c).join('')}</section>`; });
VIEWS.reviews = listView('reviews', '보고서 검토', (r) => `<section class="card">${r.reviews.map((x) => `<div class="tl"><span class="dot" style="background:${x.상태 === '검토완료' ? '#16A34A' : '#F59E0B'}"></span><div class="grow"><div style="display:flex;gap:8px;align-items:center"><b>${esc(x.항목)}</b><span class="note">${esc(x.회차)}회차</span><span class="pill ${x.상태 === '검토완료' ? 'p-ok' : 'p-warn'}" style="margin-left:auto">${esc(x.상태 || '검토중')}</span></div><div class="note">${esc(x.용역)}</div><div class="note">${ymd(x.요청일)} 요청 → ${x.회신일 ? ymd(x.회신일) + ' 회신' : '회신 대기'} · ${esc(x.검토자)}</div>${x.의견 ? `<p class="memo">${esc(x.의견)}</p>` : ''}${x.조치 ? `<p class="memo" style="background:#EEF4FF">${esc(x.조치)}</p>` : ''}</div></div>`).join('') || '<div class="empty">없음</div>'}</section>`);
VIEWS.contacts = listView('contacts', '현장 연락', (r) => { const last = {}; r.contacts.forEach((c) => { if (!(c.용역 in last)) last[c.용역] = c; });
  const L = Object.values(last).sort((a, b) => (a.다음연락 || '9999').localeCompare(b.다음연락 || '9999')); const t = new Date().toISOString().slice(0, 10);
  return `<section class="card"><h2>현장별 마지막 연락</h2>${L.map((c) => `<button class="row tap" data-site="${esc(c.용역)}" style="flex-direction:column;align-items:stretch;gap:4px"><div style="display:flex;gap:8px;align-items:center"><span class="t ell grow">${esc(c.용역)}</span>${c.다음연락 ? `<span class="pill ${c.다음연락 <= t ? 'p-warn' : 'p-mute'}">다음 ${md(c.다음연락)}</span>` : ''}</div><div class="s">${ymd(c.연락일)} · ${esc(c.방법)} · ${esc(c.담당자)} · ${esc(c.공정)}</div>${c.메모 ? `<p class="memo">${esc(c.메모)}</p>` : ''}</button>`).join('')}</section>`; });
VIEWS.mails = listView('mails', '메일', (r) => `<section class="card">${r.mails.map((m) => `<button class="row tap" data-site="${esc(m.용역)}" style="flex-direction:column;align-items:stretch;gap:4px"><div style="display:flex;gap:8px;align-items:center"><span class="pill p-mute">${esc(m.구분 || '-')}</span><span class="s">${ymd(m.보낸날)}</span><span class="pill ${/대기/.test(m.회신상태) ? (m.경과 > 14 ? 'p-bad' : 'p-warn') : /받음/.test(m.회신상태) ? 'p-ok' : 'p-mute'}" style="margin-left:auto">${esc(m.회신상태 || '-')}</span></div><div class="t">${esc(m.제목)}</div><div class="s">${esc(m.용역)}${m.받는사람 ? ' · ' + esc(m.받는사람) : ''}${m.첨부 ? ' · 첨부: ' + esc(m.첨부) : ''}</div>${m.회신내용 ? `<p class="memo">${esc(m.회신내용)}</p>` : ''}</button>`).join('') || '<div class="empty">없음</div>'}</section>`);
VIEWS.journal = listView('journal', '업무일지', (r) => { const g = {}; r.journal.forEach((j) => { (g[j.날짜] = g[j.날짜] || []).push(j); });
  return `<section class="card">${Object.entries(g).map(([d, js]) => `<div class="dhead">${ymd(d)} <span class="note">${esc(js[0].요일)}</span></div>${js.map((j) => `<div class="tl"><span class="dot" style="background:${j.상태 === '완료' ? '#16A34A' : '#F59E0B'}"></span><div class="grow"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill p-info">${esc(j.구분 || '기타')}</span><span class="pill ${j.상태 === '완료' ? 'p-ok' : 'p-warn'}">${esc(j.상태 || '-')}</span></div><div class="t" style="margin-top:4px">${esc(j.현장)}</div><div>${esc(j.내용)}</div>${j.후속 ? `<div class="note">후속 · ${esc(j.후속)}</div>` : ''}</div></div>`).join('')}`).join('')}</section>`; });
VIEWS.outsource = listView('outsource', '외주·택배', (r) => `<section class="card"><h2>외주</h2>${r.outsource.map((o) => `<div class="row"><div class="grow"><div class="t ell">${esc(o.업체)}</div><div class="s">${ymd(o.일자)} · ${esc(o.용역)} · ${esc(o.작업)}</div></div><div style="text-align:right"><div class="amt">${won(o.청구)}</div><span class="pill ${o.미지급 > 0 ? 'p-warn' : 'p-ok'}">${esc(o.상태)}</span></div></div>`).join('') || '<div class="empty">없음</div>'}</section>
  <section class="card"><h2>택배</h2>${r.parcels.map((p) => `<div class="row" style="flex-direction:column;align-items:stretch;gap:2px"><div class="t">${ymd(p.발송일)} · ${esc(p.용역)}</div><div class="s">${esc(p.항목)} · ${esc(p.받는사람)}</div><div class="s">${esc(p.주소)}${p.비고 ? ' · ' + esc(p.비고) : ''}</div></div>`).join('') || '<div class="empty">없음</div>'}</section>`);
VIEWS.me = async () => {
  const r = await call('me', {}, { nocache: true });
  let admin = '';
  if (r.user.admin) { const a = await call('admin', {}, { nocache: true }); admin = `<section class="card"><h2>전체 기기 관리 (관리자)</h2>${a.devices.map((d) => `<div class="row" style="flex-direction:column;align-items:stretch;gap:6px"><div style="display:flex;gap:8px;align-items:center"><span class="t ell grow">${esc(d.email)}</span><span class="pill ${d.status === '사용' ? 'p-ok' : d.status === '차단' ? 'p-bad' : 'p-mute'}">${esc(d.status)}</span></div><div class="s">${esc(d.name)} · 등록 ${esc(d.since)} · 마지막 ${esc(d.last)}</div>${d.status === '사용' ? `<div style="display:flex;gap:8px"><button class="btn sm" data-rv="${esc(d.id)}">해제</button><button class="btn sm danger" data-bl="${esc(d.id)}">차단 (분실)</button></div>` : ''}</div>`).join('')}</section>`; }
  shell('내 정보', `<section class="card"><h2>${esc(r.user.name)}</h2><div class="note">${esc(r.user.email)} · ${r.user.admin ? '관리자' : '조회 전용'}</div><div class="note">이 기기: ${esc(r.device.name)}</div></section>
    <section class="card"><h2>내 기기</h2>${r.devices.map((d) => `<div class="row"><div class="grow"><div class="t">${esc(d.name)}${d.me ? ' (이 기기)' : ''}</div><div class="s">등록 ${esc(d.since)} · 마지막 ${esc(d.last)}</div></div>${d.status === '사용' && !d.me ? `<button class="btn sm" data-rv="${esc(d.id)}">해제</button>` : `<span class="pill ${d.status === '사용' ? 'p-ok' : 'p-mute'}">${esc(d.status)}</span>`}</div>`).join('')}</section>
    ${admin}<button class="btn danger" id="lo">이 기기 로그아웃</button><p class="note">로그아웃하면 이 기기의 인증이 바로 무효가 되고, 다시 쓰려면 이메일 인증을 한 번 더 해야 합니다.</p>`, {
    bind() {
      document.querySelectorAll('[data-rv],[data-bl]').forEach((b) => (b.onclick = async () => { if (!confirm(b.dataset.bl ? '이 기기를 차단할까요? 분실한 휴대폰에 쓰세요.' : '이 기기의 인증을 해제할까요?')) return; await call('revoke', { id: b.dataset.rv || b.dataset.bl, block: !!b.dataset.bl }, { nocache: true }); show(); }));
      $('#lo').onclick = async () => { if (!confirm('이 기기에서 로그아웃할까요?')) return; try { await call('logout', {}, { nocache: true }); } catch (e) {} await signOut('로그아웃했습니다.'); };
    },
  });
};
function bindCommon() {
  document.querySelectorAll('[data-go]').forEach((b) => (b.onclick = () => { const k = b.dataset.go; if (['sites', 'cal'].includes(k)) { App.stack = [[k, {}]]; show(); } else go(k, { title: (MORE.find((m) => m[0] === k) || [])[2] }); }));
  document.querySelectorAll('[data-site]').forEach((b) => (b.onclick = () => go('site', { name: b.dataset.site, title: b.dataset.site })));
}

// ---------- 최초 1회 등록
function registerView(msg) {
  $('#app').innerHTML = `<div class="center"><div class="logo">UTO</div><h1 style="margin:6px 0 0;font-size:22px">안전점검 업무관리</h1><p class="note">이 휴대폰을 처음 한 번만 등록하면, 다음부터는 열기만 해도 바로 업무 현황이 보입니다.</p>
    ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
    <label class="note" for="em">회사에 등록된 이메일</label><input class="inp" id="em" type="email" inputmode="email" autocomplete="email" placeholder="name@company.com">
    <button class="btn pri" id="sc">인증 코드 받기</button>
    <div id="st2" style="display:none;flex-direction:column;gap:12px"><label class="note" for="cd">메일로 받은 6자리 코드</label><input class="inp" id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button class="btn pri" id="vf">이 기기 등록</button></div>
    <p class="note" id="msg"></p></div>`;
  $('#sc').onclick = async () => {
    const em = $('#em').value.trim(); if (!em) return;
    $('#sc').disabled = true; $('#msg').textContent = '보내는 중…';
    try { const r = await run('requestCode', em); $('#msg').textContent = r.msg; $('#st2').style.display = 'flex'; $('#cd').focus(); } catch (e) { $('#msg').textContent = '보내지 못했습니다. 인터넷 연결을 확인하세요. (' + ((e && e.message) || e) + ')'; }
    $('#sc').disabled = false;
  };
  $('#vf').onclick = async () => {
    $('#vf').disabled = true; $('#msg').textContent = '확인 중…';
    const ua = navigator.userAgent, dev = /iPhone/.test(ua) ? 'iPhone' : /Android/.test(ua) ? 'Android 휴대폰' : /iPad/.test(ua) ? 'iPad' : '브라우저';
    try {
      const r = await run('verifyCode', $('#em').value.trim(), $('#cd').value.trim(), dev + ' · ' + new Date().toLocaleDateString('ko-KR'));
      if (!r.ok) { $('#msg').textContent = r.msg; $('#vf').disabled = false; return; }
      App.token = r.token; const saved = await Vault.set('tk', r.token); App.stack = [['home', {}]]; show(); if (!saved) setTimeout(() => alert('이 브라우저에서는 인증 정보를 안전하게 저장할 수 없어 자동 로그인이 유지되지 않습니다.\nSafari(아이폰) 또는 Chrome(안드로이드)에서 열어 주세요.'), 300);
    } catch (e) { $('#msg').textContent = '확인하지 못했습니다. 다시 시도하세요. (' + ((e && e.message) || e) + ')'; $('#vf').disabled = false; }
  };
}
async function signOut(msg) { App.token = null; Vault.clear(); registerView(msg); }

// ---------- 시작: 저장된 기기 인증이 있으면 바로 대시보드
(async () => {
  App.token = await Vault.get('tk');
  if (!App.token) return registerView();
  App.stack = [['home', {}]];
  show();
})();
</script>
</body>
</html>
