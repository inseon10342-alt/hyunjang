const dlab = (n) => (n == null ? '' : n === 0 ? 'D-day' : n > 0 ? 'D-' + n : 'D+' + -n);

// ---------- 안전한 보관: 브라우저가 꺼낼 수 없는 키(IndexedDB)로 토큰·캐시를 암호화해 저장
const Vault = (() => {
  let keyP = null;
  const db = () => new Promise((res, rej) => { const r = indexedDB.open('ssv', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  async function key() {
    if (keyP) return keyP;
    const to = (ms) => new Promise((_, rej) => setTimeout(() => rej(new Error('vault timeout')), ms));
    keyP = Promise.race([to(4000), (async () => {
      const d = await db();
      const got = await new Promise((res) => { const t = d.transaction('k').objectStore('k').get('aes'); t.onsuccess = () => res(t.result); t.onerror = () => res(null); });
      if (got) return got;
      const k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      await new Promise((res) => { const t = d.transaction('k', 'readwrite').objectStore('k').put(k, 'aes'); t.onsuccess = res; t.onerror = res; });
      return k;
    })()]);
    keyP.catch(() => { keyP = null; });
    return keyP;
  }
  const b64 = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
  const ub = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  return {
    async set(name, val) { try { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await key(), new TextEncoder().encode(JSON.stringify(val))); localStorage.setItem('v:' + name, b64(iv) + '.' + b64(ct)); return true; } catch (e) { return false; } },
    async get(name) { try { const s = localStorage.getItem('v:' + name); if (!s) return null; const [iv, ct] = s.split('.'); const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(iv) }, await key(), ub(ct)); return JSON.parse(new TextDecoder().decode(pt)); } catch (e) { return null; } },
    del(name) { try { localStorage.removeItem('v:' + name); } catch (e) {} },
    clear() { try { Object.keys(localStorage).filter((k) => k.startsWith('v:')).forEach((k) => localStorage.removeItem(k)); } catch (e) {} },
  };
})();

// ---------- 서버 호출 (조회 전용)
const App = { token: null, user: null, stack: [], meta: null, offline: false, lastOk: null };
function run(fn, ...args) {
  // Apps Script 안에서 열면 google.script.run, 별도 주소(GitHub Pages)에서 열면 config.js 의 웹앱 주소로 요청
  if (window.google && google.script && google.script.run) {
    return new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error('timeout')), 120000);
      google.script.run.withSuccessHandler((r) => { clearTimeout(t); res(r); }).withFailureHandler((e) => { clearTimeout(t); rej(e); })[fn](...args);
    });
  }
  if (!window.API_URL || !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(window.API_URL)) return Promise.reject(new Error('config.js 에 웹앱 주소(API_URL)를 넣어 주세요.'));
  // <script> 로 요청 (아이폰 Safari 는 다른 주소로의 fetch 응답을 막는 경우가 있음). 요청마다 1회용 콜백 이름을 쓴다.
  return new Promise((res, rej) => {
    const cb = '__r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const sc = document.createElement('script');
    const done = (fnr, v) => { clearTimeout(t); try { delete window[cb]; } catch (e) { window[cb] = undefined; } sc.remove(); fnr(v); };
    const t = setTimeout(() => done(rej, new Error('timeout')), 90000);
    window[cb] = (r) => done(res, r);
    sc.onerror = () => done(rej, new Error('Load failed'));
    sc.src = window.API_URL + '?cb=' + cb + '&q=' + encodeURIComponent(JSON.stringify({ fn, args })) + '&_=' + Date.now();
    document.head.appendChild(sc);
  });
}
// 화면은 휴대폰에 암호화해 둔 직전 결과로 바로 그리고, 서버 확인은 뒤에서 한다 (바뀌었으면 다시 그림)
App.inflight = {}; App.failAt = {};
async function netCall(action, arg, key) {
  const send = Object.assign({}, arg || {}); if (App.forceNet) send._r = 1;
  const r = await run('api', App.token, action, send);
  if (!r || !r.ok) {
    if (r && r.code === 'auth') { await signOut(r.msg); throw new Error('auth'); }
    throw new Error((r && r.msg) || '데이터를 받지 못했습니다.');
  }
  App.offline = false; App.meta = r.meta || App.meta; App.lastOk = new Date();
  if (key) await Vault.set('c:' + key, { at: Date.now(), r });
  return r;
}
function revalidate(action, arg, key, c) {
  if (App.inflight[key] || Date.now() - (App.failAt[key] || 0) < 60000) return;
  App.inflight[key] = 1;
  const top = JSON.stringify(App.stack[App.stack.length - 1]);
  const same = () => JSON.stringify(App.stack[App.stack.length - 1]) === top;
  netCall(action, arg, key)
    .then((r) => { if (same() && JSON.stringify(r) !== JSON.stringify(c.r)) show(); else if (same()) stampOk(); })
    .catch((e) => { if (e.message === 'auth') return; App.failAt[key] = Date.now(); App.offline = true; App.cacheAt = c.at; if (same()) show(); })
    .finally(() => { delete App.inflight[key]; });
}
function stampOk() { const el = document.querySelector('.stamp'); if (el && App.meta && !App.offline) el.classList.remove('err'); }
async function call(action, arg, opt) {
  opt = opt || {};
  const key = action + ':' + JSON.stringify(arg || {});
  if (!opt.nocache && !App.forceNet) {
    const c = await Vault.get('c:' + key);
    if (c) {
      App.meta = c.r.meta || App.meta;
      if (!App.offline || Date.now() - (App.failAt[key] || 0) >= 60000) { if (Date.now() - c.at > 15000) revalidate(action, arg, key, c); }
      if (App.offline) App.cacheAt = c.at;
      return c.r;
    }
  }
  try {
    return await netCall(action, arg, opt.nocache ? null : key);
  } catch (e) {
    if (e.message === 'auth') throw e;
    const c = opt.nocache ? null : await Vault.get('c:' + key);
    App.offline = true;
    if (c) { App.meta = c.r.meta; App.cacheAt = c.at; return c.r; }
    throw e;
  }
}
function calRange(y, m) {
  if (y == null) { const t = new Date(); y = t.getFullYear(); m = t.getMonth(); }
  const f = new Date(y, m, 1), a = new Date(y, m, 1 - f.getDay()), b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 41);
  return { from: isoD(a), to: isoD(b) };
}
// 홈을 연 뒤 아래 탭(현장 목록·일정)만 미리 받아 둔다 — 상세 정보는 누를 때 받는다
let prefetched = false;
function prefetch() {
  if (prefetched) return; prefetched = true;
  setTimeout(() => { [['sites', {}], ['schedule', calRange()]].forEach(([a, g]) => { const k = a + ':' + JSON.stringify(g); Vault.get('c:' + k).then((c) => { if (!c || Date.now() - c.at > 15000) netCall(a, g, k).catch(() => {}); }); }); }, 800);
  // 업무 메뉴 8개는 하루 한 번만, 오늘 받아 둔 게 없는 화면만 하나씩 차례로 받는다
  setTimeout(async () => {
    const today = isoD(new Date());
    for (const a of ['writing', 'pay', 'requests', 'reviews', 'contacts', 'mails', 'journal', 'outsource']) {
      const k = a + ':{}', c = await Vault.get('c:' + k);
      if (c && isoD(new Date(c.at)) === today) continue;
      try { await netCall(a, {}, k); } catch (e) { break; }
    }
  }, 3000);
}

    : App.meta ? `<div class="stamp">엑셀 최종 수정 ${esc(App.meta.updatedAt || '-')}${App.meta.statusAt ? ' · 보고서도구 ' + esc(App.meta.statusAt.slice(5, 16)) : ''} · 조회 전용</div>` : '';
  $('#app').innerHTML = `<header class="hdr">${back ? `<button class="ib" id="bk" aria-label="뒤로">${ic('back')}</button>` : ''}<h1>${esc(title)}</h1><button class="ib" id="rf" aria-label="새로고침">${ic('refresh')}</button></header>${stamp}<main id="m">${body}</main>
    <nav class="bn" aria-label="메뉴">${TABS.map(([k, i, l]) => `<button data-tab="${k}" class="${App.stack[0] && App.stack[0][0] === k ? 'on' : ''}" ${App.stack[0] && App.stack[0][0] === k ? 'aria-current="page"' : ''}>${ic(i)}<span>${l}</span></button>`).join('')}</nav>`;
  if (back) $('#bk').onclick = () => { App.stack.pop(); show(); };
  $('#rf').onclick = async () => {
    const b = $('#rf'); if (b.classList.contains('spin')) return;
    b.classList.add('spin');
    if (await checkVersion(true)) return;
    try { await show(true); } finally { const n = $('#rf'); if (n) n.classList.remove('spin'); }
    toast(App.offline ? '연결이 불안정해 갱신하지 못했습니다' : '최신 내용으로 새로 고쳤습니다');
  };
  document.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { App.stack = [[b.dataset.tab, {}]]; show(); }));

  window.scrollTo(0, 0);
}
function go(name, arg) { App.stack.push([name, arg || {}]); show(); }
async function show(refresh) {
  const [name, arg] = App.stack[App.stack.length - 1];

}

    { bind: () => { bindCommon(); document.querySelectorAll('[data-mk]').forEach((b) => (b.onclick = () => go('mail', { k: b.dataset.mk, title: shortSite(m.용역) }))); } });
};
const rkey = (x) => [x.요청일, x.no, x.자료].join('|');
const rDone = (x) => /완료/.test(x.상태);
const rOver = (x) => !rDone(x) && x.기한 && daysTo(x.기한) < 0;
const rstat = (x) => (rDone(x) ? ['p-ok', '수신완료'] : rOver(x) ? ['p-bad', `기한 초과 ${-daysTo(x.기한)}일`] : x.기한 ? ['p-warn', `미수신 · 기한 ${dlab(daysTo(x.기한))}`] : ['p-warn', x.상태 || '미수신']);
VIEWS.requests = async () => {
  const Q = (await call('requests')).requests;
  filterList('requests', '자료 요청', Q, {
    chips: [['미수신', (x) => !rDone(x), 'cn-warn'], ['기한 초과', rOver, 'cn-bad'], ['수신완료', rDone], ['전체', () => true]],
    ph: '자료·현장·담당자 검색', text: (x) => [x.자료, x.용역, x.담당자, x.항목, x.메모],
    group: (x) => (x.요청일 ? `${ymd(x.요청일)} 요청` : '요청일 없음'),
    row: (x) => { const [c, l] = rstat(x); return `<button class="li tap" data-open="${esc(rkey(x))}"><span class="lbar ${c}"></span><div class="grow"><div class="lt">${esc(x.자료 || '(내용 없음)')}</div>
      <div class="ls"><b>${esc(shortSite(x.용역))}</b>${x.항목 ? ' · ' + esc(x.항목) : ''}${x.담당자 ? ' · ' + esc(x.담당자) : ''}</div>
      <div class="lm"><span class="pill ${c}">${l}</span>${x.수신일 ? `<span class="att">${ymd(x.수신일)} 수신${x.소요 !== '' ? ` · ${esc(x.소요)}일 걸림` : ''}</span>` : ''}</div></div>${ic('chev', 18)}</button>`; },
    open: (k) => { const x = Q.find((y) => rkey(y) === k); go('request', { k, title: shortSite(x && x.용역) || '자료 요청' }); },
  });
};
VIEWS.request = async (arg) => {
  const Q = (await call('requests')).requests, x = Q.find((y) => rkey(y) === arg.k);
  if (!x) return shell('자료 요청', '<div class="card empty">요청을 찾지 못했습니다. 새로고침해 보세요.</div>', { bind: bindCommon });
  const [c, l] = rstat(x), same = Q.filter((y) => y.용역 === x.용역 && rkey(y) !== arg.k);
  shell(shortSite(x.용역) || '자료 요청', `
    <section class="card"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill ${c}">${l}</span>${x.구분 ? `<span class="pill p-mute">${esc(x.구분)}</span>` : ''}${x.항목 ? `<span class="pill p-info">${esc(x.항목)}</span>` : ''}</div>
      <h2 class="mh">${nl(x.자료 || '(요청 내용 없음)')}</h2>
      <dl class="kv"><dt>현장</dt><dd>${esc(x.용역)}</dd><dt>담당자</dt><dd>${esc(x.담당자 || '-')}</dd><dt>요청 방법</dt><dd>${esc(x.방법 || '-')}</dd>${x.점검일 ? `<dt>관련 점검일</dt><dd>${ymd(x.점검일)}</dd>` : ''}${x.원요청 ? `<dt>원요청 NO</dt><dd>${esc(x.원요청)}</dd>` : ''}</dl>
      <button class="btn sm" style="margin-top:12px" data-site="${esc(x.용역)}">현장 보기 ›</button></section>
    <section class="card"><h2>진행</h2><div class="steps">
      <div class="st on"><i></i><div><b>요청</b><span>${ymd(x.요청일) || '-'}${x.방법 ? ' · ' + esc(x.방법) : ''}</span></div></div>
      ${x.기한 ? `<div class="st ${rOver(x) ? 'bad' : 'on'}"><i></i><div><b>회신 기한</b><span>${ymd(x.기한)}${!rDone(x) ? ' · ' + dlab(daysTo(x.기한)) : ''}</span></div></div>` : ''}
      <div class="st ${rDone(x) ? 'ok' : ''}"><i></i><div><b>${rDone(x) ? '수신 완료' : '수신 대기'}</b><span>${x.수신일 ? ymd(x.수신일) + (x.소요 !== '' ? ` · 요청 후 ${esc(x.소요)}일` : '') : '아직 받지 않았습니다'}</span></div></div></div></section>
    ${x.메모 ? `<section class="card"><h2>수신 자료 검토 · 통화 메모</h2><div class="memo">${nl(x.메모)}</div></section>` : ''}
    ${x.비고 ? `<section class="card"><h2>비고</h2><div class="memo">${nl(x.비고)}</div></section>` : ''}
    ${same.length ? `<section class="card"><h2>같은 현장 요청 · ${same.length}</h2>${same.map((y) => { const [cc, ll] = rstat(y); return `<button class="row tap" data-rk="${esc(rkey(y))}"><div class="grow"><div class="t" style="font-size:14px;line-height:1.4">${esc(y.자료)}</div><div class="s">${ymd(y.요청일)}${y.항목 ? ' · ' + esc(y.항목) : ''}</div></div><span class="pill ${cc}">${ll}</span></button>`; }).join('')}</section>` : ''}`,
    { bind: () => { bindCommon(); document.querySelectorAll('[data-rk]').forEach((b) => (b.onclick = () => go('request', { k: b.dataset.rk, title: shortSite(x.용역) }))); } });
};
VIEWS.contacts = async () => {
  const C = (await call('contacts')).contacts, last = {};
  C.forEach((c) => { if (!(c.용역 in last)) last[c.용역] = c; });
  const latest = Object.values(last), t = tday();
  const st = App.lf.contacts = App.lf.contacts || { f: '현장별 최근', q: '' };
  const isLatest = (c) => last[c.용역] === c;
  filterList('contacts', '현장 연락', C, {
    chips: [['현장별 최근', isLatest], ['다음 연락 도래', (c) => isLatest(c) && c.다음연락 && c.다음연락 <= t, 'cn-warn'], ['전체 기록', () => true]],
    ph: '현장·담당자·메모 검색', text: (c) => [c.용역, c.담당자, c.메모, c.공정, c.비고],
    group: (c) => (st.f === '전체 기록' ? (c.연락일 ? ymd(c.연락일) : '날짜 없음') : ''),
    row: (c) => { const n = daysTo(c.다음연락); return `<button class="li tap" data-open="${esc(c.용역)}"><span class="lbar ${c.다음연락 && n <= 0 ? 'p-warn' : 'p-info'}"></span><div class="grow">
      <div class="lt" style="-webkit-line-clamp:1">${esc(c.용역)}</div>
      <div class="ls">${ymd(c.연락일)} · ${esc(c.방법 || '-')}${c.담당자 ? ' · ' + esc(c.담당자) : ''}</div>
      ${c.공정 ? `<div class="ls">현재 공정: ${esc(c.공정)}</div>` : ''}
      ${c.메모 ? `<div class="lq">${esc(c.메모)}</div>` : ''}
      <div class="lm">${c.다음연락 ? `<span class="pill ${n <= 0 ? 'p-warn' : 'p-mute'}">다음 연락 ${md(c.다음연락)}${n != null ? ' · ' + dlab(n) : ''}</span>` : ''}${c.예상시기 ? `<span class="att">다음 점검 예상 ${md(c.예상시기)}</span>` : ''}</div></div>${ic('chev', 18)}</button>`; },
    open: (n) => go('contact', { n, title: shortSite(n) }),
  });
};
VIEWS.contact = async (arg) => {
  const C = (await call('contacts')).contacts.filter((c) => c.용역 === arg.n);
  const nx = C.find((c) => c.다음연락), ex = C.find((c) => c.예상시기 || c.예상점검);
  shell(shortSite(arg.n) || '현장 연락', `
    <section class="card"><h2 class="mh" style="margin-top:0">${esc(arg.n)}</h2>
      <div class="grid2" style="margin-top:10px"><div class="box"><span>마지막 연락</span><b style="font-size:15px">${C[0] ? ymd(C[0].연락일) : '-'}</b><small class="note">${C[0] ? esc([C[0].방법, C[0].담당자].filter(Boolean).join(' · ')) : ''}</small></div>
      <div class="box"><span>다음 연락 예정</span><b style="font-size:15px">${nx ? ymd(nx.다음연락) : '-'}</b><small class="note">${nx ? dlab(daysTo(nx.다음연락)) : ''}</small></div></div>
      ${ex ? `<p class="note" style="margin:10px 0 0">다음 점검 예상: ${esc(ex.예상점검 || '')} ${ex.예상시기 ? ymd(ex.예상시기) : ''}</p>` : ''}
      <button class="btn sm" style="margin-top:12px" data-site="${esc(arg.n)}">현장 보기 ›</button></section>
    <section class="card"><h2>연락 기록 · ${C.length}</h2>${C.map((c) => `<div class="tl"><span class="dot" style="background:var(--blue)"></span><div class="grow">
      <div class="t" style="font-size:14.5px">${ymd(c.연락일)} <span class="note">· ${esc(c.방법 || '-')}${c.담당자 ? ' · ' + esc(c.담당자) : ''}</span></div>
      ${c.공정 ? `<div class="s" style="margin-top:2px"><b>현재 공정</b> ${esc(c.공정)}</div>` : ''}
      ${c.메모 ? `<div class="memo">${nl(c.메모)}</div>` : ''}
      ${c.예상점검 || c.예상시기 || c.다음연락 ? `<div class="lm" style="margin-top:6px">${c.예상점검 || c.예상시기 ? `<span class="att">다음 점검 ${esc(c.예상점검 || '')} ${c.예상시기 ? md(c.예상시기) : ''}</span>` : ''}${c.다음연락 ? `<span class="att">다음 연락 ${md(c.다음연락)}</span>` : ''}</div>` : ''}
      ${c.비고 ? `<div class="s" style="margin-top:4px">비고: ${esc(c.비고)}</div>` : ''}</div></div>`).join('') || '<div class="empty">기록 없음</div>'}</section>`, { bind: bindCommon });
};

function bindCommon() {
  document.querySelectorAll('[data-go]').forEach((b) => (b.onclick = () => { const k = b.dataset.go; if (['sites', 'cal'].includes(k)) { App.stack = [[k, {}]]; show(); } else go(k, { title: (MORE.find((m) => m[0] === k) || [])[2] }); }));
  document.querySelectorAll('[data-site]').forEach((b) => (b.onclick = () => go('site', { name: b.dataset.site, title: b.dataset.site })));
}

// ---------- 최초 1회 등록
function registerView(msg) {
  $('#app').innerHTML = `<div class="center"><div class="logo">UTO</div><h1 style="margin:6px 0 0;font-size:22px">안전점검 업무관리</h1><p class="note">이 휴대폰을 처음 한 번만 등록하면, 다음부터는 열기만 해도 바로 업무 현황이 보입니다.</p>
    ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
    <label class="note" for="em">회사에 등록된 이메일</label><input class="inp" id="em" type="email" inputmode="email" autocomplete="email" placeholder="name@company.com">
    <button class="btn pri" id="sc">인증 코드 받기</button>
    <div id="st2" style="display:none;flex-direction:column;gap:12px"><label class="note" for="cd">메일로 받은 6자리 코드</label><input class="inp" id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button class="btn pri" id="vf">이 기기 등록</button></div>
    <p class="note" id="msg"></p></div>`;
  $('#sc').onclick = async () => {
    const em = $('#em').value.trim(); if (!em) return;
    $('#sc').disabled = true; $('#msg').textContent = '보내는 중…';
    try { const r = await run('requestCode', em); $('#msg').textContent = r.msg; $('#st2').style.display = 'flex'; $('#cd').focus(); } catch (e) { $('#msg').textContent = '보내지 못했습니다. 인터넷 연결을 확인하세요. (' + ((e && e.message) || e) + ')'; }
    $('#sc').disabled = false;
  };
  $('#vf').onclick = async () => {
    $('#vf').disabled = true; $('#msg').textContent = '확인 중…';
    const ua = navigator.userAgent, dev = /iPhone/.test(ua) ? 'iPhone' : /Android/.test(ua) ? 'Android 휴대폰' : /iPad/.test(ua) ? 'iPad' : '브라우저';
    try {
      const r = await run('verifyCode', $('#em').value.trim(), $('#cd').value.trim(), dev + ' · ' + new Date().toLocaleDateString('ko-KR'));
      if (!r.ok) { $('#msg').textContent = r.msg; $('#vf').disabled = false; return; }
      App.token = r.token; const saved = await Vault.set('tk', r.token); App.stack = [['home', {}]]; show(); if (!saved) setTimeout(() => alert('이 브라우저에서는 인증 정보를 안전하게 저장할 수 없어 자동 로그인이 유지되지 않습니다.\nSafari(아이폰) 또는 Chrome(안드로이드)에서 열어 주세요.'), 300);
    } catch (e) { $('#msg').textContent = '확인하지 못했습니다. 다시 시도하세요. (' + ((e && e.message) || e) + ')'; $('#vf').disabled = false; }
  };
}
async function signOut(msg) { App.token = null; Vault.clear(); registerView(msg); }

// ---------- 화면 새 버전 확인 (GitHub Pages 는 10분까지 예전 파일을 보여 줄 수 있어, version.json 을 캐시 없이 확인)
const APP_VERSION = '2026-11-12i';
async function checkVersion(manual) {
  if (window.google && google.script && google.script.run) return false; // Apps Script 안에서 열 때는 해당 없음
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return false;
    const v = String((await r.json()).v || '');
    if (!v || v === APP_VERSION) return false;
    let tried = ''; try { tried = sessionStorage.getItem('vtry') || ''; } catch (e) {}
    if (tried === v && !manual) return false; // 한 번 시도했는데도 같으면 반복하지 않음
    try { sessionStorage.setItem('vtry', v); } catch (e) {}
    location.replace(location.pathname + '?v=' + encodeURIComponent(v));
    return true;
  } catch (e) { return false; }
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion(false); });

// 확대·축소 막기 (아이폰은 viewport 설정을 무시할 때가 있어 제스처도 막음)
['gesturestart', 'gesturechange', 'gestureend'].forEach((t) => document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });

// ---------- 시작: 저장된 기기 인증이 있으면 바로 대시보드
(async () => {
  if (await checkVersion(false)) return;
  App.token = await Vault.get('tk');
  if (!App.token) return registerView();
  App.stack = [['home', {}]];
  show();
})();
</script>
